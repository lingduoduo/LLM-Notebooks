<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Taxonomy Explorer</title>
<style>
/* Offline, single file: system fonts only, no network requests. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #14171c; --ink-2: #4b525c; --ink-3: #78808b;
  --rule: #dde2e8; --hit: #fff1c2;
  --ax-content: #2a78d6; --ax-format: #eb6834; --ax-interaction: #1baf7a;
  --ax-identity: #eda100; --ax-commerce: #e87ba4; --ax-generic: #008300;
  --f-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111316; --surface: #1a1d21; --ink: #eef0f2; --ink-2: #b8bec6; --ink-3: #8a919b;
  --rule: #2c3138; --hit: #4a3f12;
  --ax-content: #3987e5; --ax-format: #d95926; --ax-interaction: #199e70;
  --ax-identity: #c98500; --ax-commerce: #d55181; --ax-generic: #008300;
  color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding: 32px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.01em; }
.meta { color: var(--ink-2); font: 0.85rem var(--f-mono); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
#q { flex: 1 1 240px; min-width: 0; padding: 8px 12px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
#q:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink-3); outline-offset: 2px; }
.axes { display: flex; flex-wrap: wrap; gap: 6px; }
.axis-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font: 0.8rem var(--f-body);
  color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; }
.axis-btn[aria-pressed="false"] { color: var(--ink-3); opacity: 0.55; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.status { font-size: 0.85rem; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
details.cat { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; min-width: 0; }
details.cat > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
details.cat > summary::-webkit-details-marker { display: none; }
.code { font: 600 0.85rem var(--f-mono); }
.count { font: 0.75rem var(--f-mono); color: var(--ink-3); }
.cat-label { grid-column: 2 / -1; font-weight: 600; }
.axis-name { grid-column: 2 / -1; font: 0.75rem var(--f-mono); color: var(--ink-3); }
ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
ul ul { margin: 4px 0 0 4px; padding-left: 12px; border-left: 1px solid var(--rule); gap: 2px; }
li > .node { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.l2 > .node .label { font-weight: 600; }
.id { font: 0.75rem var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }
mark { background: var(--hit); color: inherit; border-radius: 2px; }
.empty { color: var(--ink-3); font-size: 0.9rem; }
footer { font-size: 0.8rem; color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Room Taxonomy Explorer</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="controls">
    <input id="q" type="search" placeholder="Search concepts by label or ID" aria-label="Search concepts">
    <div class="axes" id="axes" role="group" aria-label="Filter by axis"></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No concepts match. Clear the search or turn an axis back on.</p>
  <footer>Generated by "python main.py explorer" from taxonomy_v1.json. Only content categories sit under the adult_content root; other axes stand alone.</footer>
</main>
<script id="taxonomy" type="application/json">__TAXONOMY_JSON__</script>
<script>
// Labels and IDs are untrusted data: render with textContent only.
const taxonomy = JSON.parse(document.getElementById("taxonomy").textContent);
const nodes = taxonomy.nodes;
const children = new Map();
for (const n of nodes) {
  if (!children.has(n.parent_id)) children.set(n.parent_id, []);
  children.get(n.parent_id).push(n);
}
const kids = id => children.get(id) || [];
const categories = nodes.filter(n => n.level === 1);
const axes = [...new Set(categories.map(c => c.axis))];
const enabled = new Set(axes);
const make = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const swatch = axis => { const s = make("span", "sw"); s.style.setProperty("--c", `var(--ax-${axis})`); return s; };

document.getElementById("meta").textContent =
  `taxonomy ${taxonomy.version} · ${nodes.length} concepts · ${categories.length} categories · ${axes.length} axes`;

const axesEl = document.getElementById("axes");
for (const axis of axes) {
  const b = make("button", "axis-btn");
  b.type = "button";
  b.setAttribute("aria-pressed", "true");
  b.append(swatch(axis), document.createTextNode(axis));
  b.addEventListener("click", () => {
    enabled.has(axis) ? enabled.delete(axis) : enabled.add(axis);
    b.setAttribute("aria-pressed", String(enabled.has(axis)));
    render();
  });
  axesEl.append(b);
}

function highlight(text, q) {
  const span = make("span", "label");
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  if (i < 0) { span.textContent = text; return span; }
  span.append(text.slice(0, i), make("mark", null, text.slice(i, i + q.length)), text.slice(i + q.length));
  return span;
}
const matches = (n, q) => !q || n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q);
const subtreeMatches = (n, q) => matches(n, q) || kids(n.id).some(k => subtreeMatches(k, q));

function item(n, q, level) {
  const li = make("li", `l${level}`);
  const row = make("div", "node");
  row.append(highlight(n.label, q), make("span", "id", n.id));
  li.append(row);
  const shown = kids(n.id).filter(k => subtreeMatches(k, q) || matches(n, q));
  if (shown.length) {
    const ul = make("ul");
    for (const k of shown) ul.append(item(k, q, level + 1));
    li.append(ul);
  }
  return li;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  let shownConcepts = 0;
  for (const c of categories) {
    if (!enabled.has(c.axis) || !subtreeMatches(c, q)) continue;
    const det = make("details", "cat");
    det.open = Boolean(q) || categories.length <= 9;
    const sum = make("summary");
    const total = kids(c.id).reduce((t, g) => t + 1 + kids(g.id).length, 0);
    sum.append(swatch(c.axis), make("span", "code", c.category_id), make("span", "count", `${total} concepts`),
      highlight(c.label, q), make("span", "axis-name", `${c.axis} axis · ${c.parent_id ? "IS_A " + c.parent_id : "standalone"}`));
    sum.querySelector(".label").classList.add("cat-label");
    det.append(sum);
    const ul = make("ul");
    for (const g of kids(c.id)) if (matches(c, q) || subtreeMatches(g, q)) ul.append(item(g, matches(c, q) ? "" : q, 2));
    det.append(ul);
    grid.append(det);
    shownConcepts += 1 + det.querySelectorAll("li").length;
  }
  document.getElementById("empty").hidden = grid.children.length > 0;
  document.getElementById("status").textContent =
    `Showing ${grid.children.length} of ${categories.length} categories (${shownConcepts} concepts)`;
}
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
