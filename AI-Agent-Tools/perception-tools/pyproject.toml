[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-tools"
version = "0.1.0"
description = "MCP perception and data-retrieval tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=0.9.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
documents = [
  "PyPDF2>=3.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "pandas>=2.0.0",
]
media = [
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.8.0,<5",
  "numpy>=1.24,<2.3",
  "youtube-transcript-api>=0.6.0",
  "yt-dlp>=2023.0.0",
  "openai>=1.0.0",
]
data = [
  "wikipedia>=1.4.0",
  "arxiv>=2.0.0",
  "yfinance>=0.2.0",
  "waybackpy>=3.0.0",
  "chardet>=5.0.0,<6",
]
private = [
  "notion-client>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "google-auth-httplib2>=0.1.0",
  "google-api-python-client>=2.0.0",
]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "reportlab>=4.0.0",
  "ruff>=0.11.0",
]

[project.scripts]
perception-tools = "perception_tools.cli:main"
perception-tools-mcp = "perception_tools.server:main"

[tool.setuptools.packages.find]
include = ["perception_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: requires network access or external credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
